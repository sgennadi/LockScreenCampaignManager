name: Build portable EXE

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep only the latest check for each PR; preserve every main branch build.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-x86]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python for offline policy regression checks
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Fail closed on sensitive public snapshot content
        shell: pwsh
        run: |
          python tools/test_public_snapshot.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/audit_public_snapshot.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check GPO lifecycle and registry policy fixtures
        shell: pwsh
        run: |
          python tools/test_package.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_gpo_operations.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_feedback_protocol.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_manager_features.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_dual_client.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_live_ad_lab_contracts.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_diagnostics_issue_review.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate Windows PowerShell 5.1 syntax
        shell: powershell
        run: |
          $scripts = @(
            'src/LockScreenCampaignManager/Assets/LockScreen-Agent.ps1',
            'src/LockScreenCampaignManager/Assets/AD-Discovery.ps1',
            'src/LockScreenCampaignManager/Assets/GPO-Deploy.ps1',
            'src/LockScreenCampaignManager/Assets/Gpo-Lifecycle.ps1',
            'src/LockScreenCampaignManager/Assets/Gpo-ConflictScan.ps1',
            'src/LockScreenCampaignManager/Assets/Campaign-PushNow.ps1',
            'src/LockScreenCampaignManager/Assets/Sysvol-Storage.ps1',
            'src/LockScreenCampaignManager/Assets/Dc-Consistency.ps1',
            'tools/test_dc_consistency.ps1',
            'tools/test_native_gpo_lifecycle_preview.ps1',
            'tools/test_native_immediate_preview.ps1',
            'tools/test_effective_gpo.ps1',
            'tools/lab_ad_integration.ps1',
            'tools/lab_win11_probe.ps1',
            'tools/test_hosted_agent_lifecycle.ps1',
            'tools/test_windows_client_compat.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              foreach ($parseError in $errors) {
                $lineNumber = $parseError.Extent.StartLineNumber
                $columnNumber = $parseError.Extent.StartColumnNumber
                Write-Host ("PowerShell parse failure in {0} line {1}:{2}: {3}" -f $script,$lineNumber,$columnNumber,$parseError.Message)
              }
              exit 1
            }
          }

      - name: Check multi-DC SYSVOL/AD audit read-only UTC and SHA-256 contracts
        shell: powershell
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/test_dc_consistency.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify native GPO lifecycle preview hash against real PowerShell Plan
        shell: powershell
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/test_native_gpo_lifecycle_preview.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify native Immediate Actions preview hash vs real PS1 expression
        shell: powershell
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/test_native_immediate_preview.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify effective GPO candidate safety contracts (offline)
        shell: powershell
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/test_effective_gpo.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify client integrity and recovery functions
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File tools/test_client_integrity.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise real agent lifecycle in isolated HKCU on hosted Windows
        shell: powershell
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/test_hosted_agent_lifecycle.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Windows 10 and Windows 11 client agent compatibility
        shell: powershell
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/test_windows_client_compat.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify read-only post-cleanup registry comparison and no remote task execution
        shell: powershell
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/test_postcleanup_verification.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate computer group assignment parser and offline security fixtures
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File tools/test_computer_group_assignment.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Smart SYSVOL Storage safeguards and selected DC clock
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File tools/test_sysvol_storage.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify flexible schedule and stable client-side image selection
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File tools/test_schedule_selection.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify deferred retry offline classification
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File tools/test_deferred_repair.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish single-file self-contained EXE
        shell: pwsh
        run: |
          dotnet publish src/LockScreenCampaignManager/LockScreenCampaignManager.csproj `
            --configuration Release --runtime '${{ matrix.rid }}' --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false `
            --output "dist/${{ matrix.rid }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist/${{ matrix.rid }}/LockScreenCampaignManager.exe")) { exit 2 }

      # WinExe does not reliably set $LASTEXITCODE for bare & invocations.
      # Start-Process -Wait -PassThru checks the actual process exit code.
      - name: Verify GUI EXE exit-code propagation
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/${{ matrix.rid }}/LockScreenCampaignManager.exe").Path
          $probe = Start-Process -FilePath $exe -ArgumentList '--self-test-exit-probe' -Wait -PassThru
          if ($probe.ExitCode -ne 37) {
            throw "WinExe exit-code probe expected 37, got $($probe.ExitCode)"
          }

      - name: Run full self-tests (fail closed)
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/${{ matrix.rid }}/LockScreenCampaignManager.exe").Path
          $out = Join-Path $env:RUNNER_TEMP 'all-tests-stdout.txt'
          $err = Join-Path $env:RUNNER_TEMP 'all-tests-stderr.txt'
          $test = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          if (Test-Path $out) { Get-Content $out | Write-Host }
          if (Test-Path $err) { Get-Content $err | Write-Host }
          if ($test.ExitCode -ne 0) { throw "Full self-test failed with exit code $($test.ExitCode)" }

      - name: Reject invalid native EXE client modes without launching the GUI
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/${{ matrix.rid }}/LockScreenCampaignManager.exe").Path
          $reject = Start-Process -FilePath $exe -ArgumentList '--client-agent Invalid' -Wait -PassThru
          if ($reject.ExitCode -ne 2) {
            throw "Native EXE must reject invalid client modes with exit code 2: got $($reject.ExitCode)."
          }

      - name: Verify native EXE read-only Status and pinned binary SHA-256
        shell: pwsh
        run: |
          ./tools/test_native_agent_cli.ps1 -PublishedExe "dist/${{ matrix.rid }}/LockScreenCampaignManager.exe"

      - name: Verify UniversalUpdater public/private download and SHA-256
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/${{ matrix.rid }}/LockScreenCampaignManager.exe").Path
          $test = Start-Process -FilePath $exe -ArgumentList '--updater-self-test' -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "UniversalUpdater self-test failed: $($test.ExitCode)" }

      - name: Verify UniversalDiagnostics redaction and debug log
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/${{ matrix.rid }}/LockScreenCampaignManager.exe").Path
          $test = Start-Process -FilePath $exe -ArgumentList '--diagnostics-self-test' -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "Diagnostics self-test failed: $($test.ExitCode)" }

      - name: Validate WinForms dialogs at multiple simulated font scales
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/${{ matrix.rid }}/LockScreenCampaignManager.exe").Path
          $out = Join-Path $env:RUNNER_TEMP "wizard-ui-smoke-stdout.txt"
          $err = Join-Path $env:RUNNER_TEMP "wizard-ui-smoke-stderr.txt"
          $test = Start-Process -FilePath $exe -ArgumentList '--ui-smoke-test' -Wait -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          if (Test-Path $out) { Get-Content $out | Write-Host }
          if (Test-Path $err) { Get-Content $err | Write-Host }
          if ($test.ExitCode -ne 0) { throw "WinForms UI smoke-test failed: $($test.ExitCode)" }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          # Derive package version from the single csproj version source.
          $version = (dotnet msbuild src/LockScreenCampaignManager/LockScreenCampaignManager.csproj -getProperty:Version).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+-preview\.\d+$') {
            throw "Unexpected or missing application preview version"
          }
          $zip = "LockScreenCampaignManager-$version-${{ matrix.rid }}.zip"
          $stage = "dist/${{ matrix.rid }}"
          New-Item -Path "$stage/docs" -ItemType Directory -Force | Out-Null
          Copy-Item "docs/GMSA-REPAIR-RU.md" "$stage/docs/" -Force
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/$zip" -Force
          # UniversalUpdater accepts only a one-file archive.
          # GitHub Releases must be published separately; Actions artifacts
          # are not automatically visible through the Releases API.
          $updateZip = "LockScreenCampaignManager-Update-${{ matrix.rid }}.zip"
          $exe = Join-Path $stage "LockScreenCampaignManager.exe"
          Compress-Archive -LiteralPath $exe -DestinationPath "dist/$updateZip" -Force
          Add-Type -AssemblyName System.IO.Compression
          $verified = [System.IO.Compression.ZipFile]::OpenRead("dist/$updateZip")
          try {
            if ($verified.Entries.Count -ne 1 -or
                $verified.Entries[0].FullName -ne "LockScreenCampaignManager.exe") {
              throw "UniversalUpdater ZIP must contain exactly one EXE"
            }
          } finally { $verified.Dispose() }

      # PRs run the full build, self-test and ZIP integrity checks without
      # consuming Actions artifact storage for every preview commit.
      - name: Upload release build
        id: upload_release_build
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: LockScreenCampaignManager-${{ matrix.rid }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 2

      # Storage quota errors must be visible but should not invalidate code
      # tests on a passing main/dispatch build. No false artifact success.
      - name: Report artifact upload problem
        if: always() && steps.upload_release_build.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Warning 'Build and self-tests passed, but GitHub artifact upload failed. Check repository Actions artifact storage quota.'
          'Build/tests PASS; artifact upload FAILED. Free old Actions artifact storage or increase the quota, then rerun this workflow to get a downloadable ZIP.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  publish-preview:
    name: Publish tested preview release
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7

      - name: Skip stale main-branch run
        id: latest
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo "Skipping stale tested commit $GITHUB_SHA; current main is $current"
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Download tested x86/x64 packages
        if: steps.latest.outputs.publish == 'true'
        uses: actions/download-artifact@v7
        with:
          pattern: LockScreenCampaignManager-win-*
          path: release-assets
          merge-multiple: true

      - name: Verify four ZIP files and create SHA-256 manifest
        if: steps.latest.outputs.publish == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import struct
          import xml.etree.ElementTree as ET
          import zipfile

          version = ET.parse('src/LockScreenCampaignManager/LockScreenCampaignManager.csproj').getroot().findtext('./PropertyGroup/Version')
          if version != '0.4.0-preview.74':
              raise SystemExit(f'Unexpected release version: {version}')
          root = Path('release-assets')
          expected = set()
          for arch, machine in [('win-x86', 0x014c), ('win-x64', 0x8664)]:
              expected.add(f'LockScreenCampaignManager-{version}-{arch}.zip')
              expected.add(f'LockScreenCampaignManager-Update-{arch}.zip')
          actual = {f.name for f in root.iterdir() if f.is_file()}
          if actual != expected:
              raise SystemExit(f'Release asset mismatch: expected {sorted(expected)}, got {sorted(actual)}')
          for arch, machine in [('win-x86', 0x014c), ('win-x64', 0x8664)]:
              for prefix in (f'LockScreenCampaignManager-{version}-', 'LockScreenCampaignManager-Update-'):
                  archive = root / f'{prefix}{arch}.zip'
                  with zipfile.ZipFile(archive) as z:
                      names = z.namelist()
                      if len(names) != len(set(names)):
                          raise SystemExit(f'Duplicate ZIP entries: {archive}')
                      if prefix == 'LockScreenCampaignManager-Update-' and names != ['LockScreenCampaignManager.exe']:
                          raise SystemExit(f'Updater ZIP must contain only one root EXE: {archive}')
                      if 'LockScreenCampaignManager.exe' not in names:
                          raise SystemExit(f'EXE missing: {archive}')
                      exe = z.read('LockScreenCampaignManager.exe')
                      if exe[:2] != b'MZ':
                          raise SystemExit(f'Invalid PE header: {archive}')
                      pe_offset = struct.unpack_from('<I', exe, 0x3c)[0]
                      if exe[pe_offset:pe_offset+4] != bytes((80, 69, 0, 0)) or struct.unpack_from('<H', exe, pe_offset+4)[0] != machine:
                          raise SystemExit(f'Incorrect Windows PE architecture: {archive}')
          lines = [f'{hashlib.sha256(f.read_bytes()).hexdigest()}  {f.name}' for f in sorted(root.glob('*.zip'))]
          (root / 'SHA256SUMS.txt').write_text(chr(10).join(lines) + chr(10), encoding='ascii')
          print('PASS: x86/x64 standalone and updater ZIPs verified; SHA-256 manifest written')
          PY

      - name: Publish 0.4.0-preview.74 (no overwrite)
        if: steps.latest.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='v0.4.0-preview.74'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; no assets overwritten."
            exit 0
          fi
          gh release create "$tag" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'LockScreen Campaign Manager 0.4.0-preview.74' \
            --prerelease --notes-file docs/RELEASE-PREVIEW74.md

      - name: Verify public release digest metadata for UniversalUpdater
        if: steps.latest.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='v0.4.0-preview.74'
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > release-meta.json
          python - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path('release-meta.json').read_text(encoding='utf-8'))
          assets = {asset['name']: asset for asset in metadata.get('assets', [])}
          expected = {file.name for file in Path('release-assets').iterdir() if file.is_file()}
          if not metadata.get('prerelease') or metadata.get('draft') or not expected.issubset(assets):
              raise SystemExit('Release missing required public preview assets')
          for name in expected:
              if name == 'SHA256SUMS.txt':
                  continue
              digest = assets[name].get('digest') or ''
              if not digest.startswith('sha256:') or len(digest) != 71:
                  raise SystemExit('Release asset has no SHA-256 digest: ' + name)
          print('PASS: public GitHub Release includes verified metadata for UniversalUpdater')
          PY
